spring.application.name=cardgame

# H2 database stored as a file in backend/data/ so decks survive restarts
spring.datasource.url=jdbc:h2:file:./data/cardgame
spring.datasource.username=sa
spring.datasource.password=

# create/alter tables to match the @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update

# browse the database at http://localhost:8080/h2-console (dev only)
spring.h2.console.enabled=true
