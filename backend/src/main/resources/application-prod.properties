# Production settings, used when the app runs with SPRING_PROFILES_ACTIVE=prod.
# Anything set here overrides application.properties.

# Postgres connection, read from environment variables set on the hosting platform
# (never commit real passwords to git)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# the H2 console is a dev tool; it must never be reachable on the internet
spring.h2.console.enabled=false

# the site is served over HTTPS, so only send the login cookie over HTTPS
server.servlet.session.cookie.secure=true

# hosting platforms tell the app which port to listen on
server.port=${PORT:8080}
